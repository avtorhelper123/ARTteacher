plugins { id 'com.android.application' }

android {
    namespace 'ru.arturok.artteacher'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.arturok.artteacher'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress 'html' }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
