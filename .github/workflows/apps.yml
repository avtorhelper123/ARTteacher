name: Приложение ARTteacher (APK и IPA)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/apps.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artteacher-apps
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Встроить ARTteacher в приложение
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
      - name: Собрать APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Подготовить APK
        run: cp android/app/build/outputs/apk/release/app-release.apk artteacher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: artteacher-apk
          path: artteacher.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Установить XcodeGen
        run: brew install xcodegen
      - name: Собрать IPA без подписи
        working-directory: ios
        run: |
          mkdir -p Web
          cp ../index.html Web/index.html
          xcodegen generate
          xcodebuild -project ARTteacher.xcodeproj -scheme ARTteacher -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ARTteacher.app Payload/
          zip -qry ../artteacher.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: artteacher-ipa
          path: artteacher.ipa

  release:
    needs: [android, ios]
    if: always() && needs.android.result == 'success' && needs.ios.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: artteacher-*
          merge-multiple: true
      - name: Создать уникальный тег сборки
        id: tag
        run: echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ARTteacher — сборка ${{ github.run_number }}
          make_latest: true
          body: |
            **Android:** скачай artteacher.apk и открой его на устройстве.
            **iPhone/iPad:** artteacher.ipa собирается без подписи. Для установки потребуется подходящий способ sideloading и подпись Apple ID.
            Это первая автоматическая сборка ARTteacher.
          files: |
            artteacher.apk
            artteacher.ipa
